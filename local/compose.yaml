name: checkout-gain-local
services:
  backend:
    image: ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
    platform: linux/arm64
    stop_signal: SIGINT
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:6210:3210"
      - "127.0.0.1:6211:3211"
    volumes:
      - data:/convex/data
    environment:
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:6210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:6211
      DISABLE_BEACON: "true"
      DISABLE_METRICS_ENDPOINT: "true"
      RUST_LOG: warn
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      start_period: 10s
  dashboard:
    image: ghcr.io/get-convex/convex-dashboard@sha256:f85cf0d0448b9c835ae3df5c7c1c6f0145dd4c8f0f92eb0245daf304efdd9f1a
    platform: linux/arm64
    ports:
      - "127.0.0.1:6792:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://127.0.0.1:6210
      NEXT_PUBLIC_LOAD_MONACO_INTERNALLY: "true"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  data:
    name: checkout-gain-sandbox-data
